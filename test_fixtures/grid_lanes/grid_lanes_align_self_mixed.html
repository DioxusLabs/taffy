<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Grid Lanes: align-self overrides align-items per item in the stacking axis
  </title>
</head>
<body>

<div id="test-root" style="display: grid-lanes; grid-template-columns: 40px 40px 40px; width: 120px; height: 100px; align-items: start;">
  <div style="height: 30px;"></div>
  <div style="height: 10px; align-self: end;"></div>
  <div style="height: 20px; align-self: center;"></div>
  <div style="height: 10px; grid-column: span 3;"></div>
  <div style="height: 15px; align-self: end;"></div>
</div>

</body>
</html>
