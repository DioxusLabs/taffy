<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Grid Lanes: dense packing in the row direction
  </title>
</head>
<body>

<!-- Chrome selects dense packing with its grid-lanes-pack property; Taffy reads the dense keyword of grid-auto-flow -->
<div id="test-root" style="height: 150px; width: 200px; display: grid-lanes; grid-lanes-direction: row; grid-template-rows: 50px 50px 50px; flow-tolerance: 0px; grid-lanes-pack: dense; grid-auto-flow: dense;">
  <div style="width: 40px;"></div>
  <div style="width: 10px;"></div>
  <div style="width: 20px;"></div>
  <div style="width: 20px; grid-row: span 2;"></div>
  <div style="width: 10px;"></div>
  <div style="width: 10px;"></div>
</div>

</body>
</html>
