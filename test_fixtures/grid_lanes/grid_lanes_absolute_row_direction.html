<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Grid Lanes: absolutely positioned children in a row grid lanes container
  </title>
</head>
<body>

<div id="test-root" style="position: relative; display: grid-lanes; grid-lanes-direction: row; grid-template-rows: 40px 40px 40px; gap: 10px; width: 100px; height: 140px; padding: 5px;">
  <div style="width: 30px;"></div>
  <div style="width: 20px;"></div>
  <div style="width: 10px;"></div>
  <div style="position: absolute; grid-row: 2 / 3; inset: 0;"></div>
  <div style="position: absolute; grid-row: 1 / 3; top: 10px; left: 10px; width: 20px; height: 20px;"></div>
  <div style="position: absolute; grid-row: 3 / 4; width: 20px; height: 20px; justify-self: end; align-self: center;"></div>
  <div style="position: absolute; grid-column: 1 / 2; width: 20px; height: 20px; justify-self: end;"></div>
</div>

</body>
</html>
