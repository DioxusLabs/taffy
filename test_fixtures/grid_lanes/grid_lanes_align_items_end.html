<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Grid Lanes: align-items end moves items next to a gap to the end of the gap
  </title>
</head>
<body>

<div id="test-root" style="display: grid-lanes; grid-template-columns: 40px 40px 40px; width: 120px; height: 100px; align-items: end;">
  <div style="height: 30px;"></div>
  <div style="height: 10px;"></div>
  <div style="height: 20px;"></div>
  <div style="height: 10px; grid-column: span 3;"></div>
  <div style="height: 15px;"></div>
</div>

</body>
</html>
