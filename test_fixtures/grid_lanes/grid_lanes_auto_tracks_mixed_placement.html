<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Grid Lanes: definitely placed items only contribute to their own auto track
  </title>
</head>
<body>

<div id="test-root" style="width: 300px; display: grid-lanes; grid-template-columns: auto auto auto;">
  <div style="width: 120px; height: 20px; grid-column: 2;"></div>
  <div style="width: 40px; height: 30px;"></div>
  <div style="width: 60px; height: 10px;"></div>
  <div style="width: 20px; height: 40px;"></div>
  <div style="width: 30px; height: 20px; grid-column: 3;"></div>
</div>

</body>
</html>
