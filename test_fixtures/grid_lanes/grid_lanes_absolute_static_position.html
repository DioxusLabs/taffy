<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Grid Lanes: static position of absolutely positioned children with self-alignment
  </title>
</head>
<body>

<div id="test-root" style="position: relative; display: grid-lanes; grid-template-columns: 40px 40px 40px; gap: 10px; width: 140px; height: 100px;">
  <div style="height: 30px;"></div>
  <div style="height: 20px;"></div>
  <div style="height: 10px;"></div>
  <div style="position: absolute; width: 20px; height: 20px;"></div>
  <div style="position: absolute; grid-column: 2 / 3; width: 20px; height: 20px; justify-self: end;"></div>
  <div style="position: absolute; grid-column: 2 / 3; width: 20px; height: 20px; justify-self: center; align-self: center;"></div>
  <div style="position: absolute; grid-column: 3 / 4; width: 20px; height: 20px; align-self: end;"></div>
  <div style="position: absolute; grid-column: 1 / 4; width: 20px; height: 20px; justify-self: center; align-self: center;"></div>
</div>

</body>
</html>
