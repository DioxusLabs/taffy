<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Grid Lanes: absolutely positioned child uses its grid-axis grid area as containing block
  </title>
</head>
<body>

<div id="test-root" style="position: relative; display: grid-lanes; grid-template-columns: 40px 40px 40px; gap: 10px; width: 140px; height: 100px; padding: 5px;">
  <div style="height: 30px;"></div>
  <div style="height: 20px;"></div>
  <div style="height: 10px;"></div>
  <div style="position: absolute; grid-column: 2 / 3; inset: 0;"></div>
  <div style="position: absolute; grid-column: 1 / 3; top: 10px; left: 10px; width: 20px; height: 20px;"></div>
  <div style="position: absolute; grid-column: 3 / 4; bottom: 0; right: 0; width: 20px; height: 20px;"></div>
</div>

</body>
</html>
