<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Grid Lanes: percentage rows re-resolve against the container height once it is known
  </title>
</head>
<body>

<div id="test-root" style="display: grid-lanes; grid-lanes-direction: row; grid-template-rows: 60% 140%; width: 50px; flow-tolerance: 0;">
  <div style="grid-row: 1; width: 20px; height: 20px;"></div>
  <div style="grid-row: 2; width: 20px; height: 20px;"></div>
  <div style="grid-row: 1; width: 20px; height: 20px;"></div>
</div>

</body>
</html>
