  <div style="display: block; width: 100px; height: 100px;">
    <div style="position: absolute; display: flex; flex-wrap: wrap; left: 60px;">

      <div style="width: 30px; height: 10px; flex-shrink: 0;"></div>

  </div>

  </div>
  <div style="display: block; width: 100px; height: 100px;">
