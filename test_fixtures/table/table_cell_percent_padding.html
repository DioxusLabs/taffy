<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Percentage padding on a cell resolves against the row's width</title>
</head>
<body>

<div id="test-root" style="display: block; width: 400px;">
  <div style="display: table; width: 100px; border-spacing: 0; border-collapse: separate; padding: 0;">
    <div style="display: table-row;">
      <div style="display: table-cell; padding: 10%;">
        <div style="display: block; width: 20px; height: 30px;"></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
