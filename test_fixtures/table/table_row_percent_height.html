<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Row with a percentage height inside a fixed-height table</title>
</head>
<body>

<table id="test-root" style="border-spacing: 0; box-sizing: border-box; height: 100px;">
  <tbody>
    <tr style="height: 50%;"><td style="padding: 0; box-sizing: border-box; width: 40px;"></td></tr>
    <tr><td style="padding: 0; box-sizing: border-box; width: 40px; height: 20px;"></td></tr>
  </tbody>
</table>

</body>
</html>
