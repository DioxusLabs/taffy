<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>A cell's height is a minimum: the row grows to content taller than it</title>
</head>
<body>

<div id="test-root" style="display: table; border-spacing: 0; border-collapse: separate;">
  <div style="display: table-row;">
    <div style="display: table-cell; padding: 0; height: 20px;">
      <div style="display: block; width: 50px; height: 100px;"></div>
    </div>
    <div style="display: table-cell; padding: 0; height: 150px;">
      <div style="display: block; width: 50px; height: 30px;"></div>
    </div>
  </div>
</div>

</body>
</html>
