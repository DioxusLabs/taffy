<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Rowspanning cell taking part in its first row baseline</title>
</head>
<body>

<div id="test-root" style="display: flex; align-items: baseline;">
  <div style="display: block; width: 20px; height: 10px;"></div>
  <table style="border-spacing: 0; box-sizing: border-box;">
    <tbody>
      <tr>
        <td style="padding: 0; box-sizing: border-box; vertical-align: baseline; width: 40px;"><div style="display: block; height: 10px;"></div></td>
        <td rowspan="2" style="padding: 20px 0 0 0; box-sizing: border-box; vertical-align: baseline; width: 40px;"><div style="display: block; height: 10px;"></div></td>
      </tr>
      <tr>
        <td style="padding: 0; box-sizing: border-box; vertical-align: baseline; width: 40px;"><div style="display: block; height: 10px;"></div></td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
