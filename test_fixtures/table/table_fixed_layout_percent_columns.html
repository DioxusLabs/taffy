<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Fixed layout with percentage columns in the first row
  </title>
</head>
<body>

<div id="test-root" style="display: table; border-collapse: separate; table-layout: fixed; width: 200px;">
  <div style="display: table-row-group;">
    <div style="display: table-row;">
      <div style="display: table-cell; width: 25%; height: 20px;"></div>
      <div style="display: table-cell; width: 75%; height: 20px;"></div>
    </div>
    <div style="display: table-row;">
      <div style="display: table-cell; height: 20px;">HH</div>
      <div style="display: table-cell; height: 20px;">HH</div>
    </div>
  </div>
</div>

</body>
</html>
