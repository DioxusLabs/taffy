<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Table baseline synthesized from cells with no content</title>
</head>
<body>

<div id="test-root" style="display: flex; align-items: baseline;">
  <div style="display: block; width: 20px; height: 10px;"></div>
  <table style="border-spacing: 0; box-sizing: border-box;">
    <tbody><tr>
      <td style="padding: 0 0 50px 0; box-sizing: border-box; vertical-align: baseline; width: 40px; height: 100px;"></td>
      <td style="padding: 0; box-sizing: border-box; vertical-align: baseline; width: 40px; height: 75px;"></td>
    </tr></tbody>
  </table>
</div>

</body>
</html>
