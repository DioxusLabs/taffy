<head>

  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    An auto-width BFC root whose padding and border don't fit beside the float moves below it
  </title>

<body>

<div id="test-root" style="display: block; width: 300px;">
  <div style="float: left; width: 290px; height: 50px;"></div>

</div>
