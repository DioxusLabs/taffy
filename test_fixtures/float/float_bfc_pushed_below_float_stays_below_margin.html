<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A BFC root that moves down to avoid a float is never placed higher than the position its top margin reserved
  </title>
</head>
<body>

<div id="test-root" style="display: block; width: 100px;">
  <div style="float: left; width: 50px; height: 50px;"></div>
  <div style="float: left; width: 90px; height: 100px;"></div>
  <div style="display: block; overflow: hidden; width: 40px; height: 10px; margin-top: 60px;"></div>
</div>

</body>
</html>
