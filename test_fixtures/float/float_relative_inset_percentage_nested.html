<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Percentage insets on a relatively positioned float resolve against its parent block content box, not the block formatting context root
  </title>
</head>
<body>

<div id="test-root" style="display: block; width: 400px; padding: 10px;">
  <div style="display: block; width: 200px; height: 100px; margin-left: 30px; padding: 20px; border: 5px solid red;">
    <div style="float: left; position: relative; width: 50px; height: 20px; left: 10%; top: 10%;"></div>
    <div style="float: right; position: relative; width: 50px; height: 20px; right: 10%; bottom: 10%;"></div>
  </div>
</div>

</body>
</html>
