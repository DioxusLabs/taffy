<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A BFC root pulled up by a negative top margin that is too wide to fit beside the float moves below it
  </title>
</head>
<body>

<div id="test-root" style="display: block; width: 100px;">
  <div style="float: left; width: 50px; height: 50px;"></div>
  <div style="display: flow-root; width: 60px; height: 50px; margin-top: -25px;"></div>
</div>

</body>
</html>
