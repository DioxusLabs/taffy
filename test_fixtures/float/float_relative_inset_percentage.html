<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Percentage left/top on a relatively positioned float resolve against the content box of the containing block
  </title>
</head>
<body>

<div id="test-root" style="display: block; width: 400px; height: 200px; padding: 20px; border: 5px solid red;">
  <div style="float: left; position: relative; width: 50px; height: 20px; left: 10%; top: 10%;"></div>
  <div style="float: left; width: 52px; height: 20px;"></div>
</div>

</body>
</html>
