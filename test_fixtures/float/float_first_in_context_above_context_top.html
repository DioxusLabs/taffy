<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    The first float in a block formatting context is placed at the top of its containing block when that is pulled above the top of the context by a negative margin-top
  </title>
</head>
<body>

<div id="test-root" style="display: block; width: 400px; padding-top: 1px;">
  <div style="display: block; margin-top: -30px;">
    <div style="float: left; width: 100px; height: 50px;"></div>
  </div>
</div>

</body>
</html>
