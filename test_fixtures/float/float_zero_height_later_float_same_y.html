<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A float placed at the same y as an earlier zero-height float
  </title>
</head>
<body>

<div id="test-root" style="display: block; width: 500px;">
  <div style="display: block; float: left; width: 10px; height: 30px;"></div>
  <div style="display: block; float: left; clear: left; width: 100px; height: 0;"></div>
  <div style="display: block; float: left; width: 50px; height: 20px;"></div>
</div>

</body>
</html>
