<head>

  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>

    <div style="flex-direction: column; align-items: flex-start;">
      <div style="height: 50px; aspect-ratio: 1;"></div>
    </div>
  </div>
</div>

</body>
