  <title>
    A ratio'd item whose cross size is the min-content keyword rather than auto, in an indefinite-main column. The keyword is not auto, so the fit-content transfer does not apply to it, and the container's contribution is left to be decided.
  </title>
</head>
<body>

<div id="test-root" style="flex-direction: column; align-items: flex-start;">
  <div style="aspect-ratio: 1; width: min-content;">HHH</div>
</div>
