<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A column flex container's baseline taken from a scroll container item is clamped to the item's border box
  </title>
</head>
<body>

<div id="test-root" style="display: flex; align-items: baseline; width: 200px; height: 100px;">
  <div style="display: flex; flex-direction: column; align-items: flex-start; width: 100px; height: 50px;">
    <div style="display: grid; width: 30px; height: 10px; overflow: hidden;">
      <div style="width: 30px; height: 30px;"></div>
    </div>
  </div>
  <div style="width: 10px; height: 10px;"></div>
</div>

</body>
</html>
