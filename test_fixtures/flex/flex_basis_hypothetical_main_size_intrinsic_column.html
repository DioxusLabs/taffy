<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A column flex container's automatic height sums items' hypothetical main sizes: with min-height:0, content taller than the flex basis does not grow the container
  </title>
</head>
<body>

<div id="test-root" style="display: flex; flex-direction: column; width: 100px;">
  <div style="flex-basis: 200px; flex-grow: 1; flex-shrink: 1; min-height: 0px;">
    <div style="height: 300px;"></div>
  </div>
</div>

</body>
</html>
