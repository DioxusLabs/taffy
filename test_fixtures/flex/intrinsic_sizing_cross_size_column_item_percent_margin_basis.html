<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A percentage margin on a flex ITEM rather than on the container, so it resolves through the
    path that hands each item its containing-block basis.
  </title>
</head>
<body>

<div id="test-root" style="width: 300px; height: 200px;">
  <div style="flex-direction: column; align-items: flex-start; height: 200px;">
    <div style="height: 50px; aspect-ratio: 1; flex-grow: 1; margin-left: 10%; margin-right: 10%;"></div>
  </div>
</div>

</body>
