<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Flex items with mixed positive, negative and equal order values
  </title>
</head>
<body>

<div id="test-root" style="display: flex; width: 300px; height: 100px;">
  <div style="width: 30px; height: 30px; order: 1;"></div>
  <div style="width: 30px; height: 40px; order: -2;"></div>
  <div style="width: 30px; height: 50px;"></div>
  <div style="width: 30px; height: 60px; order: -1;"></div>
  <div style="width: 30px; height: 70px; order: 1;"></div>
  <div style="width: 30px; height: 80px; order: 3;"></div>
  <div style="width: 30px; height: 90px; order: -2;"></div>
</div>

</body>
</html>
