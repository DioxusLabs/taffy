<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    align-self: stretch on a ratio'd item in a column whose cross size is indefinite, so the item is asked to stretch to a size that depends on the item.
  </title>
</head>
<body>

<div id="test-root" style="flex-direction: column; height: 200px; align-items: flex-start;">
  <div style="height: 50px; aspect-ratio: 1; flex-grow: 1; align-self: stretch;"></div>
  <div style="width: 80px; height: 20px;"></div>
</div>

</body>
</html>
