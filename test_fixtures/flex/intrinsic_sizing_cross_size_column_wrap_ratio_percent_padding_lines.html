<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Percentage padding on a wrapped column, taking space out of the main axis and so moving the line break. The padding sits on a child of the root so it resolves against a width the fixture states rather than against the browser window.
  </title>
</head>
<body>

<div id="test-root" style="width: 300px;">
  <div style="flex-direction: column; flex-wrap: wrap; height: 100px; align-items: flex-start; padding: 10%;">
    <div style="aspect-ratio: 1;">HHH</div>
    <div style="aspect-ratio: 1;">HHH</div>
    <div style="aspect-ratio: 1;">HHH</div>
    <div style="aspect-ratio: 1;">HHH</div>
  </div>
</div>

</body>
</html>
