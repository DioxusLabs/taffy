  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Margins on a ratio'd item in an indefinite-width column, so the container's contribution must be the item's outer size rather than its border box.
  </title>

<body>

<div id="test-root" style="flex-direction: column; height: 200px; align-items: flex-start;">

</div>
