<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Absolutely positioned flex children are not reordered by order
  </title>
</head>
<body>

<div id="test-root" style="display: flex; width: 300px; height: 100px;">
  <div style="width: 50px; height: 50px; order: 1;"></div>
  <div style="position: absolute; width: 20px; height: 20px; order: -5;"></div>
  <div style="width: 50px; height: 50px;"></div>
  <div style="position: absolute; width: 20px; height: 20px; order: 5;"></div>
  <div style="width: 50px; height: 50px; order: -1;"></div>
</div>

</body>
</html>
