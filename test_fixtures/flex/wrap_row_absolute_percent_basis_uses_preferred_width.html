<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A percentage flex-basis that cannot resolve while a shrink-to-fit row is being sized falls back to the item's width
  </title>
</head>
<body>

<div id="test-root" style="position: relative; width: 400px; height: 200px;">
  <div style="position: absolute; left: 20px; top: 0px; display: flex; flex-wrap: wrap;">
    <div style="width: 30px; height: 10px;"></div>
    <div style="width: 50px; height: 10px;"></div>
    <div style="width: 96px; height: 8px; flex-basis: 100%;"></div>
  </div>
</div>

</body>
</html>
