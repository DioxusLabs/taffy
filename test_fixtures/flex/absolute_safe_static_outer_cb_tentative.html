<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Safe flex static alignment uses the outer containing block</title>
</head>
<body>
    <!--
    https://github.com/web-platform-tests/wpt/blob/master/css/css-flexbox/abspos/flex-abspos-align-self-safe-outer-cb-003.tentative.html
    -->
    <div id="test-root" style="display: block; position: relative; width: 200px; height: 200px; border: 3px solid blue;">
        <div style="display: flex; position: static; width: 30px; height: 25px; padding: 2px 1px; border: 1px solid black; justify-content: end; align-items: center;">
            <div style="position: absolute; width: 45px; height: 35px; align-self: safe center;"></div>
            <div style="position: absolute; width: 15px; height: 10px; align-self: safe center;"></div>
            <div style="position: absolute; width: 45px; height: 35px; margin: 2px 4px; align-self: safe center;"></div>
            <div style="position: absolute; width: 45px; height: 35px; align-self: unsafe center;"></div>
            <div style="position: absolute; width: 45px; height: 35px;"></div>
  </div>
        <div style="display: flex; position: static; flex-direction: row-reverse; width: 30px; height: 25px; padding: 2px 1px; border: 1px solid black; justify-content: flex-start; align-items: center;">
            <div style="position: absolute; width: 45px; height: 35px; align-self: safe center;"></div>
            <div style="position: absolute; width: 15px; height: 10px; align-self: safe center;"></div>
  </div>
</div>
</body>
</html>
