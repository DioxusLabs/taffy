<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A percentage main size inside an item whose flex base size was transferred through its aspect ratio from a fit-content cross size. Resolves only if that basis is treated as definite.
  </title>
</head>
<body>

<div id="test-root" style="flex-direction: column; align-items: flex-start;">
  <div style="flex-direction: column; aspect-ratio: 1;">
    <div style="width: 40px; height: 10px;"></div>
    <div style="width: 20px; height: 50%;"></div>
  </div>
</div>

</body>
</html>
