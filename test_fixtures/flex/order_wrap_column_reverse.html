<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Flex order with wrapping and reversed column direction
  </title>
</head>
<body>

<div id="test-root" style="display: flex; flex-direction: column-reverse; flex-wrap: wrap; width: 200px; height: 100px;">
  <div style="width: 40px; height: 40px; order: 2;"></div>
  <div style="width: 50px; height: 40px; order: -1;"></div>
  <div style="width: 60px; height: 40px;"></div>
  <div style="width: 70px; height: 40px; order: 1;"></div>
  <div style="width: 80px; height: 40px; order: -1;"></div>
</div>

</body>
</html>
