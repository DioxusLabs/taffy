<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Named lines with a negative index count backwards from the end of the explicit grid, continuing into the implicit lines before the grid
  </title>
</head>
<body>

<div id="test-root" style="display: grid; grid-template-columns: [col] 50px [col mid] 100px [col] 200px [col]; grid-template-rows: [row] 20px [row mid] 40px [row] 80px [row]; grid-auto-columns: 5px; grid-auto-rows: 10px;">
  <div style="grid-column: -1 col; grid-row: -2 row;"></div>
  <div style="grid-column: -1 mid; grid-row: -1 mid;"></div>
  <div style="grid-column: -2 mid; grid-row: -3 mid;"></div>
  <div style="grid-column: -5 col; grid-row: -6 row;"></div>
  <div style="grid-column: -1 foo; grid-row: -2 foo;"></div>
  <div style="grid-column: -3 foo / -2 mid; grid-row: -2 mid / -1 foo;"></div>
</div>

</body>
</html>
