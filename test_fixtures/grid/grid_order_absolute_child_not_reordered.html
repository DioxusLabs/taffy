<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Absolutely positioned grid children are not reordered by order
  </title>
</head>
<body>

<div id="test-root" style="display: grid; grid-template-columns: 40px 40px; grid-template-rows: 40px 40px; width: 80px; height: 80px;">
  <div style="order: 1;"></div>
  <div style="position: absolute; width: 20px; height: 20px; order: -5;"></div>
  <div style="order: -1;"></div>
  <div></div>
</div>

</body>
</html>
