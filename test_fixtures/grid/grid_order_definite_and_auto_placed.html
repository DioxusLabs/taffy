<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Grid with a definitely placed item and auto-placed items with order
  </title>
</head>
<body>

<div id="test-root" style="display: grid; grid-template-columns: 40px 40px 40px; grid-template-rows: 40px 40px; width: 120px; height: 80px;">
  <div style="order: 1;"></div>
  <div style="grid-row: 2; grid-column: 2;"></div>
  <div style="order: -1;"></div>
  <div style="grid-column: 1; order: 3;"></div>
  <div></div>
</div>

</body>
</html>
