<head>

  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A fit-content() track with an infinite growth limit should receive its share of a spanning item's max-content contribution (like the auto tracks either side of it), when that share is below the fit-content() argument
  </title>
</head>
<body>

<div id="test-root" style="display: grid; width: 100px; column-gap: 5px; justify-content: start; grid-template-columns: auto fit-content(110px) auto;">
  <div style="grid-row: 1; grid-column: 1 / -1;">XX&ZeroWidthSpace;XX&ZeroWidthSpace;XX&ZeroWidthSpace;XX&ZeroWidthSpace;XX&ZeroWidthSpace;X</div>
  <div style="grid-row: 2; grid-column: 1 / -1;">XXX&ZeroWidthSpace;XXX&ZeroWidthSpace;X</div>
</div>

</body>
