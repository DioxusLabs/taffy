<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Test description
  </title>
</head>
<body>

<div id="test-root" style="display: grid; overflow: scroll; width: 130px; height: 130px; padding: 10px; grid-template-columns: 30px 30px 30px; grid-template-rows: 30px 30px 30px;">
  <div style="background-color: red; position: absolute; grid-column-start: 3; left: 0; top: 0; width: 100px; height: 20px;"></div>
  <div style="background-color: green; position: absolute; grid-column-start: 3; right: 0; top: 30px; width: 100px; height: 20px;"></div>
  <div style="background-color: blue; position: absolute; grid-row-start: 3; top: 0; left: 0; width: 20px; height: 100px;"></div>
</div>

</body>
</html>
