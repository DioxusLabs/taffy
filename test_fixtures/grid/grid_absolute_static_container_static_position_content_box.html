<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    The static position of an absolutely positioned child of a grid container that is *not* its
    containing block is resolved as if it were the sole grid item in a grid area coinciding with the
    grid's content edges (inset by border and padding), for start, center and end self-alignment
  </title>
</head>
<body>

<div id="test-root" style="width: 200px; height: 200px;">
  <div style="display: grid; position: static; width: 100px; height: 100px; border: 5px solid black; padding: 10px;">
    <div style="position: absolute; width: 30px; height: 30px; align-self: start; justify-self: start;"></div>
    <div style="position: absolute; width: 30px; height: 30px; align-self: center; justify-self: center;"></div>
    <div style="position: absolute; width: 30px; height: 30px; align-self: end; justify-self: end;"></div>
  </div>
</div>

</body>
</html>
