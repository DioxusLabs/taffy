<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>Absolute grid lines within collapsed auto-fit tracks exclude overlapping gutters</title>
</head>
<body>
<div id="test-root" style="display: grid; position: relative; width: 250px; height: 250px; grid-template-columns: repeat(auto-fit, 30px) 50px; grid-template-rows: repeat(auto-fit, 30px) 50px; gap: 5px;">
  <div style="grid-column: 2 / 4; grid-row: 2 / 4;"></div>
  <div style="position: absolute; inset: 0; grid-column: 2 / 5; grid-row: 2 / 5;"></div>
  <div style="position: absolute; inset: 0; grid-column: 2 / 6; grid-row: 2 / 6;"></div>
  <div style="position: absolute; inset: 0; grid-column: 4 / 7; grid-row: 4 / 7;"></div>
  <div style="position: absolute; inset: 0; grid-column: 5 / 7; grid-row: 5 / 7;"></div>
  <div style="position: absolute; inset: 0; grid-column: 4 / 5; grid-row: 4 / 5;"></div>
</div>
</body>
</html>
