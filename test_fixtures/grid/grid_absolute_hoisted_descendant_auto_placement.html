<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    An absolutely positioned box with auto grid placement whose containing block is a grid
    container, but which is not a direct child of it (its parent is a static in-flow grid item)
  </title>
</head>
<body>

<div id="test-root" style="display: grid; grid-template-columns: 40px 40px 40px; grid-template-rows: 40px 40px 40px; padding: 10px 20px 30px 40px;">
  <div style="position: static;">
    <div style="background-color: red; position: absolute; top: 1px; bottom: 2px; left: 3px; right: 4px;"></div>
  </div>
</div>

</body>
</html>
